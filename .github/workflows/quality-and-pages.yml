name: Quality and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep deployments serialized per branch. The version suffix can be bumped
  # if GitHub ever leaves an orphaned concurrency record behind.
  group: pages-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: training/requirements.lock
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check web application
        working-directory: web
        run: |
          npm run lint
          npm test
          npm run build
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.lock
      - name: Check training pipeline
        run: python -m pytest training/tests -q
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        working-directory: web
        run: npm run test:e2e -- --project=chromium

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
