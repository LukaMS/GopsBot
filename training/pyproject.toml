[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gops-rl"
version = "1.0.0"
description = "Masked PPO and league self-play for the Game of Pure Strategy"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.4",
  "onnx==1.19.1",
  "onnxruntime==1.23.2",
  "PyYAML==6.0.3",
  "torch==2.9.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
gops-rl = "training.gops_rl.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

